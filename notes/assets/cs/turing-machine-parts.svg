<svg width="680" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text class="th" x="340" y="36" text-anchor="middle">A Turing machine has 3 parts</text>
  <!-- Blue boxes -->
  <rect x="40" y="70" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="130" y="90" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Infinite tape</text>
  <text class="ts" x="130" y="108" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Memory (cells)</text>
  <!-- Purple boxes -->
  <rect x="250" y="70" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="90" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Read/write head</text>
  <text class="ts" x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Moves left/right</text>
  <!-- Teal boxes -->
  <rect x="460" y="70" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="550" y="90" text-anchor="middle" dominant-baseline="central" fill="#085041">State rules</text>
  <text class="ts" x="550" y="108" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">The "program"</text>
  <!-- Arrow down -->
  <line x1="340" y1="126" x2="340" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Gray loop box -->
  <rect x="160" y="170" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="#444441">Loop: read cell, check rules,</text>
  <text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">write cell, move head, repeat</text>
  <!-- Arrow down -->
  <line x1="340" y1="226" x2="340" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Coral result box -->
  <rect x="180" y="264" width="320" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="340" y="286" text-anchor="middle" dominant-baseline="central" fill="#712B13">Can compute anything computable</text>
</svg>
