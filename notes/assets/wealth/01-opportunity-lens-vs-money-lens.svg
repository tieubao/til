<svg width="100%" viewBox="0 0 680 520">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:currentColor" x="170" y="36" text-anchor="middle">Money lens</text>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:currentColor" x="510" y="36" text-anchor="middle">Opportunity lens</text>

<line x1="340" y1="20" x2="340" y2="490" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- Money lens boxes (gray) -->
<rect x="60" y="56" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A" x="170" y="74" text-anchor="middle">Direct transfer</text>
<text style="font-family:sans-serif;font-size:12px;fill:#5F5E5A" x="170" y="92" text-anchor="middle">Gift, loan, handout</text>

<rect x="60" y="126" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A" x="170" y="144" text-anchor="middle">One-time event</text>
<text style="font-family:sans-serif;font-size:12px;fill:#5F5E5A" x="170" y="162" text-anchor="middle">Fixed amount, no leverage</text>

<rect x="60" y="196" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A" x="170" y="214" text-anchor="middle">Creates dependency</text>
<text style="font-family:sans-serif;font-size:12px;fill:#5F5E5A" x="170" y="232" text-anchor="middle">You need them again</text>

<rect x="60" y="266" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A" x="170" y="284" text-anchor="middle">Transactional</text>
<text style="font-family:sans-serif;font-size:12px;fill:#5F5E5A" x="170" y="302" text-anchor="middle">Depletes their patience</text>

<!-- Opportunity lens boxes (teal) -->
<rect x="400" y="56" width="220" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#085041" x="510" y="74" text-anchor="middle">Deal flow proximity</text>
<text style="font-family:sans-serif;font-size:12px;fill:#0F6E56" x="510" y="92" text-anchor="middle">See what they see</text>

<rect x="400" y="126" width="220" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#085041" x="510" y="144" text-anchor="middle">Pattern recognition</text>
<text style="font-family:sans-serif;font-size:12px;fill:#0F6E56" x="510" y="162" text-anchor="middle">Absorb 20 years of judgment</text>

<rect x="400" y="196" width="220" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#085041" x="510" y="214" text-anchor="middle">Network access</text>
<text style="font-family:sans-serif;font-size:12px;fill:#0F6E56" x="510" y="232" text-anchor="middle">Their introductions open doors</text>

<rect x="400" y="266" width="220" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#085041" x="510" y="284" text-anchor="middle">Compounds over time</text>
<text style="font-family:sans-serif;font-size:12px;fill:#0F6E56" x="510" y="302" text-anchor="middle">Each insight builds on the last</text>

<!-- Arrows -->
<line x1="280" y1="82" x2="398" y2="82" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="280" y1="152" x2="398" y2="152" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="280" y1="222" x2="398" y2="222" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="280" y1="292" x2="398" y2="292" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Bottom boxes -->
<rect x="140" y="360" width="400" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#3C3489" x="340" y="378" text-anchor="middle">The real transfer</text>
<text style="font-family:sans-serif;font-size:12px;fill:#534AB7" x="340" y="396" text-anchor="middle">Not their money. Their map of where money comes from.</text>

<line x1="510" y1="318" x2="440" y2="358" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)" fill="none"/>

<rect x="140" y="440" width="400" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text style="font-family:sans-serif;font-size:14px;font-weight:500;fill:#712B13" x="340" y="458" text-anchor="middle">What you owe in return</text>
<text style="font-family:sans-serif;font-size:12px;fill:#993C1D" x="340" y="476" text-anchor="middle">Be worth their time. Bring signal, not just presence.</text>

<line x1="340" y1="412" x2="340" y2="438" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
</svg>
