<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, sans-serif">
  <rect width="900" height="600" fill="#FAFAF7"/>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">
    Decision Problems: The Common Language of Complexity Theory
  </text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#6B7280">
    Why both classical and quantum computing speak in YES/NO
  </text>

  <!-- Layer 1: Real-world problems -->
  <g>
    <text x="60" y="105" font-size="13" font-weight="600" fill="#374151">1. Real-world problems</text>
    <rect x="60" y="115" width="180" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="150" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Search</text>
    <text x="150" y="156" text-anchor="middle" font-size="10" fill="#92400E">Find smallest prime factor</text>

    <rect x="260" y="115" width="180" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="350" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Optimization</text>
    <text x="350" y="156" text-anchor="middle" font-size="10" fill="#92400E">Shortest path through N cities</text>

    <rect x="460" y="115" width="180" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="550" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Function</text>
    <text x="550" y="156" text-anchor="middle" font-size="10" fill="#92400E">Factor N = pq</text>

    <rect x="660" y="115" width="180" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="750" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Counting</text>
    <text x="750" y="156" text-anchor="middle" font-size="10" fill="#92400E">How many solutions?</text>
  </g>

  <!-- Arrows down -->
  <g stroke="#9CA3AF" stroke-width="1.5" fill="none">
    <path d="M 150 175 L 150 210" marker-end="url(#arrow)"/>
    <path d="M 350 175 L 350 210" marker-end="url(#arrow)"/>
    <path d="M 550 175 L 550 210" marker-end="url(#arrow)"/>
    <path d="M 750 175 L 750 210" marker-end="url(#arrow)"/>
  </g>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">reduce to YES/NO form</text>

  <!-- Layer 2: Decision problem (the funnel) -->
  <g>
    <rect x="180" y="220" width="540" height="80" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="450" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">
      Decision Problem
    </text>
    <text x="450" y="270" text-anchor="middle" font-size="12" fill="#1E3A8A">
      Input x  →  Output ∈ { YES, NO }   (1 bit)
    </text>
    <text x="450" y="288" text-anchor="middle" font-size="11" fill="#1E40AF" font-style="italic">
      "Does N have a factor smaller than k?"   "Is f constant?"
    </text>
  </g>

  <!-- Arrow down -->
  <g stroke="#9CA3AF" stroke-width="1.5" fill="none">
    <path d="M 450 305 L 450 340" marker-end="url(#arrow)"/>
  </g>
  <text x="540" y="328" font-size="11" fill="#6B7280" font-style="italic">defines</text>

  <!-- Layer 3: Complexity classes -->
  <g>
    <text x="60" y="360" font-size="13" font-weight="600" fill="#374151">3. Complexity classes (sets of decision problems)</text>

    <!-- Classical -->
    <rect x="60" y="375" width="380" height="190" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="250" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Classical</text>

    <rect x="80" y="410" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="130" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">P</text>
    <text x="130" y="448" text-anchor="middle" font-size="9" fill="#065F46">poly-time solvable</text>

    <rect x="200" y="410" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="250" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">NP</text>
    <text x="250" y="448" text-anchor="middle" font-size="9" fill="#92400E">poly-time verifiable</text>

    <rect x="320" y="410" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="370" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">BPP</text>
    <text x="370" y="448" text-anchor="middle" font-size="9" fill="#5B21B6">probabilistic poly</text>

    <text x="250" y="495" text-anchor="middle" font-size="11" fill="#4B5563" font-style="italic">All defined as:</text>
    <text x="250" y="513" text-anchor="middle" font-size="10" fill="#4B5563">"set of decision problems solvable</text>
    <text x="250" y="527" text-anchor="middle" font-size="10" fill="#4B5563">under resource constraint R"</text>
    <text x="250" y="550" text-anchor="middle" font-size="10" fill="#6B7280">P ⊆ NP, P ⊆ BPP</text>

    <!-- Quantum -->
    <rect x="460" y="375" width="380" height="190" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="650" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">Quantum</text>

    <rect x="480" y="410" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="560" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">BQP</text>
    <text x="560" y="448" text-anchor="middle" font-size="9" fill="#5B21B6">quantum poly, error &lt; 1/3</text>

    <rect x="660" y="410" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="740" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">QMA</text>
    <text x="740" y="448" text-anchor="middle" font-size="9" fill="#5B21B6">quantum NP</text>

    <text x="650" y="495" text-anchor="middle" font-size="11" fill="#5B21B6" font-style="italic">Measurement outputs bits</text>
    <text x="650" y="513" text-anchor="middle" font-size="10" fill="#5B21B6">→ 1 qubit measured = {0, 1}</text>
    <text x="650" y="527" text-anchor="middle" font-size="10" fill="#5B21B6">→ YES/NO is the natural fit</text>
    <text x="650" y="550" text-anchor="middle" font-size="10" fill="#6B7280">P ⊆ BPP ⊆ BQP</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="450" y="590" text-anchor="middle" font-size="10" fill="#9CA3AF">
    Decision problems are the "assembly language" of complexity. Quantum inherits this framing from classical CS.
  </text>
</svg>
