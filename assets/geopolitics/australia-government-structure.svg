<svg width="100%" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
<style>
  text { font-family: system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .label { font-size: 11px; fill: #888780; }
</style>
<!-- Outer container -->
<rect x="40" y="20" width="600" height="740" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" fill="#444441">Federal parliamentary constitutional monarchy</text>
<text class="ts" x="340" y="66" text-anchor="middle">Constitution adopted 1901</text>
<!-- Head of state -->
<rect x="80" y="90" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="200" y="108" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Head of state</text>
<text class="ts" x="200" y="124" text-anchor="middle" dominant-baseline="central" fill="#534AB7">King Charles III</text>
<line x1="320" y1="115" x2="360" y2="115" stroke="#888" stroke-width="1"/>
<rect x="360" y="90" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="480" y="108" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Governor-General</text>
<text class="ts" x="480" y="124" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Represents the monarch</text>
<line x1="340" y1="140" x2="340" y2="170" stroke="#888" stroke-width="1"/>
<text class="label" x="340" y="184" text-anchor="middle">SEPARATION OF POWERS (three branches)</text>
<!-- Three branches -->
<rect x="60" y="200" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="150" y="218" text-anchor="middle" dominant-baseline="central" fill="#085041">Legislative</text>
<text class="ts" x="150" y="234" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Makes laws</text>
<rect x="250" y="200" width="180" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central" fill="#712B13">Executive</text>
<text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Implements laws</text>
<rect x="440" y="200" width="180" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="530" y="218" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Judicial</text>
<text class="ts" x="530" y="234" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Interprets laws</text>
<!-- Detail boxes -->
<line x1="150" y1="250" x2="150" y2="275" stroke="#888" stroke-width="1"/>
<rect x="60" y="275" width="180" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="150" y="296" text-anchor="middle" dominant-baseline="central" fill="#085041">Parliament</text>
<text class="ts" x="150" y="316" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Senate (76 seats)</text>
<text class="ts" x="150" y="334" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">House of Reps (150)</text>
<text class="ts" x="150" y="352" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Bicameral</text>
<line x1="340" y1="250" x2="340" y2="275" stroke="#888" stroke-width="1"/>
<rect x="250" y="275" width="180" height="100" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="296" text-anchor="middle" dominant-baseline="central" fill="#712B13">PM + Cabinet</text>
<text class="ts" x="340" y="316" text-anchor="middle" dominant-baseline="central" fill="#993C1D">PM: Anthony Albanese</text>
<text class="ts" x="340" y="334" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Gov't departments</text>
<text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Executive Council</text>
<line x1="530" y1="250" x2="530" y2="275" stroke="#888" stroke-width="1"/>
<rect x="440" y="275" width="180" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="530" y="296" text-anchor="middle" dominant-baseline="central" fill="#0C447C">High Court</text>
<text class="ts" x="530" y="316" text-anchor="middle" dominant-baseline="central" fill="#185FA5">7 justices</text>
<text class="ts" x="530" y="334" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Final court of appeal</text>
<text class="ts" x="530" y="352" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Constitutional review</text>
<!-- Divider -->
<line x1="80" y1="405" x2="600" y2="405" stroke="#888" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="label" x="340" y="425" text-anchor="middle">THREE LEVELS OF GOVERNMENT (federation)</text>
<!-- Federal -->
<rect x="60" y="445" width="560" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="462" text-anchor="middle" dominant-baseline="central" fill="#633806">Federal (Commonwealth)</text>
<text class="ts" x="340" y="480" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Defence, foreign affairs, immigration, trade, taxation</text>
<line x1="340" y1="495" x2="340" y2="520" stroke="#888" stroke-width="1"/>
<!-- States -->
<rect x="60" y="520" width="268" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="194" y="538" text-anchor="middle" dominant-baseline="central" fill="#085041">6 States</text>
<text class="ts" x="194" y="554" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">NSW, VIC, QLD, WA, SA, TAS</text>
<rect x="348" y="520" width="272" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="484" y="538" text-anchor="middle" dominant-baseline="central" fill="#085041">2 Territories</text>
<text class="ts" x="484" y="554" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">ACT, Northern Territory</text>
<line x1="194" y1="570" x2="194" y2="596" stroke="#888" stroke-width="1"/>
<line x1="484" y1="570" x2="484" y2="596" stroke="#888" stroke-width="1"/>
<rect x="60" y="596" width="560" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="618" text-anchor="middle" dominant-baseline="central" fill="#085041">Health, education, justice, police, transport, land</text>
<line x1="340" y1="640" x2="340" y2="666" stroke="#888" stroke-width="1"/>
<!-- Local -->
<rect x="60" y="666" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="684" text-anchor="middle" dominant-baseline="central" fill="#444441">Local government (537 councils)</text>
<text class="ts" x="340" y="700" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Roads, waste, planning, parks, libraries</text>
<text class="ts" x="340" y="738" text-anchor="middle" fill="#888780">"Washminster" system: Westminster parliament + US-style federation + written constitution</text>
</svg>
