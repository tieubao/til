<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3730A3"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E11D48"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#FAFAFB"/>

  <!-- Title + subtitle -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">First pairing: three crypto checkpoints</text>
  <text x="550" y="60" text-anchor="middle" font-size="12" fill="#4B5563">HMAC proves QR was scanned, host signature blocks MITM, client signature proves device identity. No shared password, no CA.</text>

  <!-- Three keys panel (top) -->
  <g filter="url(#shadow)">
    <rect x="70" y="85" width="320" height="78" rx="6" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="70" y="85" width="320" height="3" fill="#3730A3"/>
    <text x="230" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">handshake_secret (16 B)</text>
    <text x="230" y="120" text-anchor="middle" font-size="9" fill="#4B5563">random, generated per QR</text>
    <text x="230" y="134" text-anchor="middle" font-size="9" fill="#4B5563">in QR ticket, one-shot</text>
    <text x="230" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">HMAC key for Register</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="400" y="85" width="320" height="78" rx="6" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="400" y="85" width="320" height="3" fill="#3730A3"/>
    <text x="560" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">host Ed25519 keypair</text>
    <text x="560" y="120" text-anchor="middle" font-size="9" fill="#4B5563">pubkey in QR (endpoint_id),</text>
    <text x="560" y="134" text-anchor="middle" font-size="9" fill="#4B5563">secret in ~/.config/zedra/identity.key</text>
    <text x="560" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">signs the Connect challenge</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="730" y="85" width="320" height="78" rx="6" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="730" y="85" width="320" height="3" fill="#3730A3"/>
    <text x="890" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">client Ed25519 keypair</text>
    <text x="890" y="120" text-anchor="middle" font-size="9" fill="#4B5563">generated on app first launch,</text>
    <text x="890" y="134" text-anchor="middle" font-size="9" fill="#4B5563">in app data dir (Secure Enclave: future)</text>
    <text x="890" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">signs back to prove device identity</text>
  </g>

  <!-- Lane headers -->
  <text x="200" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#3730A3" letter-spacing="1">PHONE</text>
  <text x="550" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#3730A3" letter-spacing="1">HOST</text>
  <text x="900" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#3730A3" letter-spacing="1">CHECKPOINTS</text>

  <!-- Lane separators -->
  <line x1="200" y1="210" x2="200" y2="680" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="550" y1="210" x2="550" y2="680" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="870" y1="210" x2="870" y2="680" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Step 0: QR scan -->
  <g filter="url(#shadow)">
    <rect x="100" y="225" width="200" height="42" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <text x="200" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">scan QR (optical)</text>
    <text x="200" y="256" text-anchor="middle" font-size="9" fill="#4B5563">decode pairing ticket</text>
  </g>
  <text x="200" y="282" text-anchor="middle" font-size="9" fill="#6B7280">phone now holds: endpoint_id, handshake_secret, session_id</text>

  <!-- Step 1: Register -->
  <g filter="url(#shadow)">
    <rect x="100" y="305" width="200" height="80" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="100" y="305" width="200" height="3" fill="#3730A3"/>
    <text x="200" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">build Register {</text>
    <text x="200" y="339" text-anchor="middle" font-size="9" fill="#4B5563">client_pubkey,</text>
    <text x="200" y="352" text-anchor="middle" font-size="9" fill="#4B5563">timestamp,</text>
    <text x="200" y="365" text-anchor="middle" font-size="9" fill="#4B5563">hmac = HMAC-SHA256(</text>
    <text x="200" y="378" text-anchor="middle" font-size="9" fill="#4B5563">handshake_secret, pk‖ts) }</text>
  </g>
  <line x1="300" y1="345" x2="445" y2="345" stroke="#3730A3" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <g filter="url(#shadow)">
    <rect x="450" y="305" width="200" height="80" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="450" y="305" width="200" height="3" fill="#3730A3"/>
    <text x="550" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">verify HMAC + freshness</text>
    <text x="550" y="339" text-anchor="middle" font-size="9" fill="#4B5563">|now − timestamp| ≤ 60s</text>
    <text x="550" y="354" text-anchor="middle" font-size="9" fill="#4B5563">consume slot atomically</text>
    <text x="550" y="369" text-anchor="middle" font-size="9" fill="#4B5563">add pk → authorized + ACL</text>
    <text x="550" y="382" text-anchor="middle" font-size="9" font-weight="600" fill="#3730A3">→ RegisterResult::Ok</text>
  </g>
  <!-- Checkpoint 1 callout -->
  <line x1="650" y1="345" x2="875" y2="245" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="4,3"/>
  <g filter="url(#shadow)">
    <rect x="880" y="225" width="200" height="62" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.4"/>
    <rect x="880" y="225" width="200" height="3" fill="#9F1239"/>
    <text x="980" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239">1. HMAC checkpoint</text>
    <text x="980" y="262" text-anchor="middle" font-size="9" fill="#4B5563">proves phone physically scanned</text>
    <text x="980" y="275" text-anchor="middle" font-size="9" fill="#4B5563">the QR (holds handshake_secret)</text>
  </g>

  <!-- Step 2: Connect → Challenge -->
  <g filter="url(#shadow)">
    <rect x="100" y="410" width="200" height="60" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="100" y="410" width="200" height="3" fill="#3730A3"/>
    <text x="200" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">send Connect {</text>
    <text x="200" y="445" text-anchor="middle" font-size="9" fill="#4B5563">client_pubkey, session_id,</text>
    <text x="200" y="460" text-anchor="middle" font-size="9" fill="#4B5563">session_token: None }</text>
  </g>
  <line x1="300" y1="440" x2="445" y2="440" stroke="#3730A3" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <g filter="url(#shadow)">
    <rect x="450" y="410" width="200" height="60" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="450" y="410" width="200" height="3" fill="#3730A3"/>
    <text x="550" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">gen 32-byte nonce</text>
    <text x="550" y="445" text-anchor="middle" font-size="9" fill="#4B5563">sign nonce with host iroh key</text>
    <text x="550" y="460" text-anchor="middle" font-size="9" font-weight="600" fill="#3730A3">→ Challenge{nonce, sig}</text>
  </g>
  <line x1="445" y1="495" x2="305" y2="495" stroke="#3730A3" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <g filter="url(#shadow)">
    <rect x="100" y="495" width="200" height="50" rx="5" fill="white" stroke="#F4A0A0" stroke-width="1.4"/>
    <rect x="100" y="495" width="200" height="3" fill="#9F1239"/>
    <text x="200" y="513" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239">verify host_signature</text>
    <text x="200" y="528" text-anchor="middle" font-size="9" fill="#4B5563">against stored endpoint_id</text>
    <text x="200" y="540" text-anchor="middle" font-size="9" fill="#4B5563">if fail → abort (MITM)</text>
  </g>
  <!-- Checkpoint 2 callout -->
  <line x1="300" y1="515" x2="875" y2="350" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="4,3"/>
  <g filter="url(#shadow)">
    <rect x="880" y="320" width="200" height="62" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.4"/>
    <rect x="880" y="320" width="200" height="3" fill="#9F1239"/>
    <text x="980" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239">2. host-sig checkpoint</text>
    <text x="980" y="357" text-anchor="middle" font-size="9" fill="#4B5563">proves host holds the secret key</text>
    <text x="980" y="370" text-anchor="middle" font-size="9" fill="#4B5563">matching the QR's endpoint_id</text>
  </g>

  <!-- Step 3: AuthProve -->
  <g filter="url(#shadow)">
    <rect x="100" y="570" width="200" height="56" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="100" y="570" width="200" height="3" fill="#3730A3"/>
    <text x="200" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">send AuthProve {</text>
    <text x="200" y="604" text-anchor="middle" font-size="9" fill="#4B5563">nonce,</text>
    <text x="200" y="617" text-anchor="middle" font-size="9" fill="#4B5563">client_sig = signer.sign(nonce) }</text>
  </g>
  <line x1="300" y1="598" x2="445" y2="598" stroke="#3730A3" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <g filter="url(#shadow)">
    <rect x="450" y="570" width="200" height="56" rx="5" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="450" y="570" width="200" height="3" fill="#3730A3"/>
    <text x="550" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">verify client_sig</text>
    <text x="550" y="605" text-anchor="middle" font-size="9" fill="#4B5563">attach, issue session_token</text>
    <text x="550" y="618" text-anchor="middle" font-size="9" font-weight="600" fill="#3730A3">→ Ok(SyncSessionResult)</text>
  </g>
  <!-- Checkpoint 3 callout -->
  <line x1="650" y1="600" x2="875" y2="455" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="4,3"/>
  <g filter="url(#shadow)">
    <rect x="880" y="425" width="200" height="62" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.4"/>
    <rect x="880" y="425" width="200" height="3" fill="#9F1239"/>
    <text x="980" y="446" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239">3. client-sig checkpoint</text>
    <text x="980" y="462" text-anchor="middle" font-size="9" fill="#4B5563">proves phone holds the app-layer</text>
    <text x="980" y="475" text-anchor="middle" font-size="9" fill="#4B5563">secret key (device identity)</text>
  </g>

  <!-- Summary card on the right -->
  <g filter="url(#shadow)">
    <rect x="880" y="520" width="200" height="120" rx="6" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
    <rect x="880" y="520" width="200" height="3" fill="#3730A3"/>
    <text x="980" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">After this dance</text>
    <text x="980" y="558" text-anchor="middle" font-size="9" fill="#4B5563">• phone pk in host's ACL forever</text>
    <text x="980" y="571" text-anchor="middle" font-size="9" fill="#4B5563">• host pubkey trusted by phone</text>
    <text x="980" y="584" text-anchor="middle" font-size="9" fill="#4B5563">• fresh session_token (RAM only)</text>
    <text x="980" y="597" text-anchor="middle" font-size="9" fill="#4B5563">• future reconnects:</text>
    <text x="980" y="610" text-anchor="middle" font-size="9" fill="#4B5563">  1 RTT (token) or 2 RTT (PKI)</text>
    <text x="980" y="628" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">QR never needed again</text>
  </g>

  <!-- Takeaway band -->
  <rect x="60" y="660" width="980" height="42" rx="6" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="550" y="679" text-anchor="middle" font-size="11" font-weight="600" fill="#3730A3">Mutual authentication from QR scan onward. No shared password, no trusted CA, no DNS-based trust.</text>
  <text x="550" y="693" text-anchor="middle" font-size="11" font-weight="600" fill="#3730A3">The QR itself is the trust anchor: pinning the host pubkey replaces the entire web-PKI stack.</text>
</svg>
