<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3730A3"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#FAFAFB"/>

  <!-- Title + subtitle -->
  <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Zedra trust topology</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#4B5563">QR establishes an Ed25519-pinned tunnel between two endpoints; two third parties see metadata only.</text>

  <!-- pkarr (top center) -->
  <g filter="url(#shadow)">
    <rect x="400" y="110" width="200" height="70" rx="8" fill="white" stroke="#9CA3AF" stroke-width="1.4"/>
    <rect x="400" y="110" width="200" height="3" fill="#9CA3AF"/>
    <text x="500" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">dns.iroh.link (pkarr)</text>
    <text x="500" y="153" text-anchor="middle" font-size="10" fill="#4B5563">hosted by Number Zero / n0</text>
    <text x="500" y="168" text-anchor="middle" font-size="9" fill="#9CA3AF">pubkey → current address (signed)</text>
  </g>

  <!-- Phone (client) -->
  <g filter="url(#shadow)">
    <rect x="80" y="280" width="220" height="120" rx="10" fill="white" stroke="#A5B4FC" stroke-width="1.6"/>
    <rect x="80" y="280" width="220" height="4" fill="#3730A3"/>
    <text x="190" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Phone (Zedra app)</text>
    <text x="190" y="328" text-anchor="middle" font-size="10" fill="#4B5563">iroh client endpoint (Ed25519)</text>
    <text x="190" y="345" text-anchor="middle" font-size="10" fill="#4B5563">app-layer signer key (Ed25519)</text>
    <text x="190" y="362" text-anchor="middle" font-size="10" fill="#4B5563">session_token (RAM)</text>
    <text x="190" y="382" text-anchor="middle" font-size="9" font-weight="600" fill="#3730A3">verifies host signature</text>
  </g>

  <!-- Host (Mac) -->
  <g filter="url(#shadow)">
    <rect x="700" y="280" width="220" height="120" rx="10" fill="white" stroke="#A5B4FC" stroke-width="1.6"/>
    <rect x="700" y="280" width="220" height="4" fill="#3730A3"/>
    <text x="810" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Host (zedra-host daemon)</text>
    <text x="810" y="328" text-anchor="middle" font-size="10" fill="#4B5563">iroh endpoint (Ed25519 per workdir)</text>
    <text x="810" y="345" text-anchor="middle" font-size="10" fill="#4B5563">SessionRegistry + ACL</text>
    <text x="810" y="362" text-anchor="middle" font-size="10" fill="#4B5563">issues + rotates session_token</text>
    <text x="810" y="382" text-anchor="middle" font-size="9" font-weight="600" fill="#3730A3">prints QR</text>
  </g>

  <!-- Relay (bottom center) -->
  <g filter="url(#shadow)">
    <rect x="400" y="470" width="200" height="70" rx="8" fill="white" stroke="#9CA3AF" stroke-width="1.4"/>
    <rect x="400" y="470" width="200" height="3" fill="#9CA3AF"/>
    <text x="500" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">iroh-relay (zedra.dev)</text>
    <text x="500" y="513" text-anchor="middle" font-size="10" fill="#4B5563">hosted by repo owner (tanlethanh)</text>
    <text x="500" y="528" text-anchor="middle" font-size="9" fill="#9CA3AF">forwards encrypted QUIC packets</text>
  </g>

  <!-- Direct tunnel (phone <-> host) -->
  <line x1="305" y1="340" x2="695" y2="340" stroke="#3730A3" stroke-width="3" marker-end="url(#arrow-indigo)" marker-start="url(#arrow-indigo)"/>
  <rect x="395" y="318" width="210" height="22" rx="4" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="500" y="333" text-anchor="middle" font-size="10" font-weight="700" fill="#3730A3">QUIC + TLS 1.3 (end-to-end)</text>

  <!-- pkarr links (phone -> pkarr, host -> pkarr) -->
  <line x1="200" y1="280" x2="430" y2="180" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="265" y="225" font-size="9" fill="#6B7280" transform="rotate(-25, 265, 225)">lookup endpoint_id</text>

  <line x1="800" y1="280" x2="570" y2="180" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="685" y="225" font-size="9" fill="#6B7280" transform="rotate(25, 685, 225)">publish signed addr</text>

  <!-- Relay links (only on relay path) -->
  <line x1="200" y1="400" x2="430" y2="490" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="800" y1="400" x2="570" y2="490" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="290" y="470" font-size="9" fill="#6B7280" transform="rotate(20, 290, 470)">fallback if direct fails</text>
  <text x="635" y="470" font-size="9" fill="#6B7280" transform="rotate(-20, 635, 470)">(WebSocket over TCP)</text>

  <!-- QR scan callout (out-of-band) -->
  <path d="M 190 280 Q 500 240 810 280" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="3,3" fill="none"/>
  <rect x="425" y="245" width="150" height="32" rx="6" fill="white" stroke="#E11D48" stroke-width="1.2"/>
  <rect x="425" y="245" width="150" height="3" fill="#E11D48"/>
  <text x="500" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#9F1239">QR scan (one-time)</text>
  <text x="500" y="272" text-anchor="middle" font-size="9" fill="#6B7280">carries host pubkey + HMAC secret</text>

  <!-- Leak surface annotation 1: pkarr -->
  <line x1="600" y1="145" x2="780" y2="115" stroke="#D97706" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="780" y="90" width="200" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <rect x="780" y="90" width="200" height="3" fill="#D97706"/>
  <text x="880" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">leaks to n0</text>
  <text x="880" y="122" text-anchor="middle" font-size="9" fill="#92400E">which pubkeys looked up,</text>
  <text x="880" y="134" text-anchor="middle" font-size="9" fill="#92400E">from which client IPs</text>

  <!-- Leak surface annotation 2: relay -->
  <line x1="600" y1="505" x2="780" y2="510" stroke="#D97706" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="780" y="485" width="200" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <rect x="780" y="485" width="200" height="3" fill="#D97706"/>
  <text x="880" y="501" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">leaks to relay operator</text>
  <text x="880" y="517" text-anchor="middle" font-size="9" fill="#92400E">timing, sizes, peer pubkeys</text>
  <text x="880" y="529" text-anchor="middle" font-size="9" fill="#92400E">(NOT contents)</text>

  <!-- Encrypted-region annotation -->
  <line x1="500" y1="340" x2="180" y2="450" stroke="#3730A3" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="20" y="425" width="170" height="60" rx="6" fill="white" stroke="#A5B4FC" stroke-width="1.2"/>
  <rect x="20" y="425" width="170" height="3" fill="#3730A3"/>
  <text x="105" y="442" text-anchor="middle" font-size="10" font-weight="700" fill="#3730A3">end-to-end encrypted</text>
  <text x="105" y="458" text-anchor="middle" font-size="9" fill="#4B5563">RPCs, terminal I/O, files,</text>
  <text x="105" y="470" text-anchor="middle" font-size="9" fill="#4B5563">AI prompts. no one in</text>
  <text x="105" y="482" text-anchor="middle" font-size="9" fill="#4B5563">the middle can read.</text>

  <!-- Takeaway band -->
  <rect x="80" y="558" width="840" height="32" rx="6" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="500" y="579" text-anchor="middle" font-size="11" font-weight="600" fill="#3730A3">Content is confidential end-to-end. Metadata leaks to two third parties: n0 (pubkey lookups) and the relay operator (peer pubkeys + timing).</text>
</svg>
