<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">M4 Pro 64 GB memory budget for Qwen3.6-35B-A3B</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#888780">Hybrid Gated DeltaNet + Attention: KV cache only on 10 of 40 layers</text>

  <!-- Bar layout: full 64 GB scale, 700px wide. 1 GB = ~10.9px. Start at x=80 -->

  <!-- Total bar background (64 GB) -->
  <rect x="80" y="80" width="700" height="40" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- macOS + daemons (16 GB reserved): 0-16 GB -->
  <rect x="80" y="80" width="175" height="40" fill="#D3D1C7"/>
  <text x="167" y="105" text-anchor="middle" font-size="11" fill="#444441">macOS + daemons</text>
  <text x="167" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">16 GB</text>

  <!-- Qwen3.6 weights Q4 (24 GB): 16-40 GB -->
  <rect x="255" y="80" width="262" height="40" fill="#534AB7"/>
  <text x="386" y="105" text-anchor="middle" font-size="11" fill="#EEEDFE">Qwen3.6-35B-A3B Q4 weights</text>
  <text x="386" y="118" text-anchor="middle" font-size="10" fill="#CECBF6">24 GB</text>

  <!-- KV cache 128k @ q8_0 (1.6 GB): 40-41.6 GB -->
  <rect x="517" y="80" width="17" height="40" fill="#1D9E75"/>
  
  <!-- Headroom: 41.6-64 GB -->
  <rect x="534" y="80" width="246" height="40" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="657" y="105" text-anchor="middle" font-size="11" fill="#5F5E5A">Headroom for GUI, browser, other apps</text>
  <text x="657" y="118" text-anchor="middle" font-size="10" fill="#888780">~22 GB</text>

  <!-- Annotation for KV cache (drawn outside the bar with leader line) -->
  <line x1="525" y1="80" x2="525" y2="155" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="525" y="170" text-anchor="middle" font-size="10" fill="#0F6E56">KV cache</text>
  <text x="525" y="184" text-anchor="middle" font-size="10" fill="#0F6E56">128k ctx, q8_0</text>
  <text x="525" y="198" text-anchor="middle" font-size="10" fill="#0F6E56">1.6 GB</text>

  <!-- Scale ticks below bar -->
  <g font-size="10" fill="#888780">
    <line x1="80" y1="120" x2="80" y2="125" stroke="#888780"/>
    <text x="80" y="138" text-anchor="middle">0</text>
    <line x1="255" y1="120" x2="255" y2="125" stroke="#888780"/>
    <text x="255" y="138" text-anchor="middle">16</text>
    <line x1="430" y1="120" x2="430" y2="125" stroke="#888780"/>
    <text x="430" y="138" text-anchor="middle">32</text>
    <line x1="605" y1="120" x2="605" y2="125" stroke="#888780"/>
    <text x="605" y="138" text-anchor="middle">48</text>
    <line x1="780" y1="120" x2="780" y2="125" stroke="#888780"/>
    <text x="780" y="138" text-anchor="middle">64 GB</text>
  </g>

  <!-- KV cache scaling table -->
  <text x="80" y="240" font-size="13" font-weight="500" fill="#2C2C2A">KV cache scaling (q8_0, 10 attention layers only)</text>

  <g font-size="11" fill="#444441">
    <!-- Header -->
    <rect x="80" y="252" width="180" height="24" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="260" y="252" width="160" height="24" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="420" y="252" width="180" height="24" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="600" y="252" width="180" height="24" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="170" y="268" text-anchor="middle" font-weight="500">Context size</text>
    <text x="340" y="268" text-anchor="middle" font-weight="500">KV cache</text>
    <text x="510" y="268" text-anchor="middle" font-weight="500">Total memory</text>
    <text x="690" y="268" text-anchor="middle" font-weight="500">Headroom</text>

    <!-- Rows -->
    <rect x="80" y="276" width="180" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="260" y="276" width="160" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="420" y="276" width="180" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="600" y="276" width="180" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="170" y="291" text-anchor="middle">32k</text>
    <text x="340" y="291" text-anchor="middle">~0.4 GB</text>
    <text x="510" y="291" text-anchor="middle">~24.4 GB</text>
    <text x="690" y="291" text-anchor="middle">23.6 GB</text>

    <rect x="80" y="298" width="180" height="22" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="260" y="298" width="160" height="22" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="420" y="298" width="180" height="22" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="600" y="298" width="180" height="22" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="170" y="313" text-anchor="middle">64k</text>
    <text x="340" y="313" text-anchor="middle">~0.8 GB</text>
    <text x="510" y="313" text-anchor="middle">~24.8 GB</text>
    <text x="690" y="313" text-anchor="middle">23.2 GB</text>

    <rect x="80" y="320" width="180" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="260" y="320" width="160" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="420" y="320" width="180" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <rect x="600" y="320" width="180" height="22" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="170" y="335" text-anchor="middle" font-weight="500">128k (recommended)</text>
    <text x="340" y="335" text-anchor="middle" font-weight="500">~1.6 GB</text>
    <text x="510" y="335" text-anchor="middle" font-weight="500">~25.6 GB</text>
    <text x="690" y="335" text-anchor="middle" font-weight="500">22.4 GB</text>
  </g>
</svg>
