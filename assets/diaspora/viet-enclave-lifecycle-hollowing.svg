<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  .c-amber > rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  .c-green > rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #27500A; }
  .c-green .ts { fill: #3B6D11; }
  .c-red > rect { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red .th { fill: #791F1F; }
  .c-red .ts { fill: #A32D2D; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="28" text-anchor="middle">Why Vietnamese enclaves hollow out</text>

<g class="c-teal">
  <rect x="200" y="50" width="280" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">Gen 1: refugees arrive (1975-90)</text>
</g>
<line x1="340" y1="94" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="200" y="114" width="280" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="132" text-anchor="middle" dominant-baseline="central">Build ethnic enclave</text>
  <text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">Pho shops, groceries, nail salons</text>
</g>
<line x1="340" y1="170" x2="340" y2="190" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
  <rect x="200" y="190" width="280" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central">Gen 2: education obsession</text>
  <text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">Push kids into college, STEM</text>
</g>

<line x1="340" y1="246" x2="200" y2="280" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="246" x2="480" y2="280" class="arr" marker-end="url(#arrow)"/>

<g class="c-green">
  <rect x="60" y="280" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="190" y="298" text-anchor="middle" dominant-baseline="central">Kids succeed individually</text>
  <text class="ts" x="190" y="318" text-anchor="middle" dominant-baseline="central">Doctors, engineers, tech</text>
</g>

<g class="c-red">
  <rect x="360" y="280" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="298" text-anchor="middle" dominant-baseline="central">Kids leave the enclave</text>
  <text class="ts" x="490" y="318" text-anchor="middle" dominant-baseline="central">Move to suburbs, mainstream</text>
</g>

<line x1="490" y1="336" x2="490" y2="360" class="arr" marker-end="url(#arrow)"/>

<g class="c-red">
  <rect x="360" y="360" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="378" text-anchor="middle" dominant-baseline="central">Enclave hollows out</text>
  <text class="ts" x="490" y="398" text-anchor="middle" dominant-baseline="central">Aging owners, empty storefronts</text>
</g>

<line x1="340" y1="440" x2="340" y2="466" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

<text class="th" x="340" y="466" text-anchor="middle">Contrast: Chinese enclave lifecycle</text>

<g class="c-purple">
  <rect x="60" y="480" width="280" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="200" y="498" text-anchor="middle" dominant-baseline="central">Clan owns the real estate</text>
  <text class="ts" x="200" y="518" text-anchor="middle" dominant-baseline="central">Property stays in community</text>
</g>

<g class="c-purple">
  <rect x="360" y="480" width="280" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="500" y="498" text-anchor="middle" dominant-baseline="central">Capital recycles internally</text>
  <text class="ts" x="500" y="518" text-anchor="middle" dominant-baseline="central">Credit, investment, succession</text>
</g>

<g class="c-gray">
  <rect x="100" y="560" width="480" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="582" text-anchor="middle" dominant-baseline="central">Vietnamese: exit through success. Chinese: stay through institutions.</text>
</g>
</svg>