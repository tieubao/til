<svg width="100%" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-red > rect { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red .th { fill: #791F1F; }
  .c-red .ts { fill: #A32D2D; }
  .c-coral > rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }
  .c-amber > rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="24" text-anchor="middle">Four Asian diasporas: 30-year projection</text>
<text class="ts" x="340" y="44" text-anchor="middle">Ethnic visibility vs. economic visibility over time</text>

<text class="ts" x="80" y="80" text-anchor="middle">Now</text>
<text class="ts" x="600" y="80" text-anchor="middle">2055</text>
<line x1="130" y1="76" x2="550" y2="76" stroke="#B4B2A9" stroke-width="0.5"/>

<g class="c-red">
  <rect x="40" y="100" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="118" text-anchor="middle" dominant-baseline="central">Japanese</text>
  <text class="ts" x="110" y="138" text-anchor="middle" dominant-baseline="central">4th-5th gen, 50%+ mixed</text>
</g>
<path d="M180 128 L560 128" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="6 4"/>
<g class="c-red">
  <rect x="480" y="100" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="118" text-anchor="middle" dominant-baseline="central">Nearly dissolved</text>
  <text class="ts" x="560" y="138" text-anchor="middle" dominant-baseline="central">Cultural, not economic</text>
</g>

<g class="c-coral">
  <rect x="40" y="180" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="198" text-anchor="middle" dominant-baseline="central">Vietnamese</text>
  <text class="ts" x="110" y="218" text-anchor="middle" dominant-baseline="central">2nd-3rd gen, integrating</text>
</g>
<path d="M180 208 Q340 208 420 168" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="6 4"/>
<g class="c-coral">
  <rect x="480" y="170" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="188" text-anchor="middle" dominant-baseline="central">Japanese path</text>
  <text class="ts" x="560" y="208" text-anchor="middle" dominant-baseline="central">Unless institutions built</text>
</g>

<g class="c-amber">
  <rect x="40" y="260" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="278" text-anchor="middle" dominant-baseline="central">Korean</text>
  <text class="ts" x="110" y="298" text-anchor="middle" dominant-baseline="central">Kye + K-wave + state</text>
</g>
<path d="M180 288 Q340 310 480 320" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="6 4"/>
<g class="c-amber">
  <rect x="480" y="260" width="160" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="284" text-anchor="middle" dominant-baseline="central">Hybrid model</text>
  <text class="ts" x="560" y="304" text-anchor="middle" dominant-baseline="central">Soft power holds identity</text>
  <text class="ts" x="560" y="320" text-anchor="middle" dominant-baseline="central">but econ hubs fade</text>
</g>

<g class="c-purple">
  <rect x="40" y="370" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="388" text-anchor="middle" dominant-baseline="central">Chinese</text>
  <text class="ts" x="110" y="408" text-anchor="middle" dominant-baseline="central">Bamboo network intact</text>
</g>
<path d="M180 398 Q340 398 480 398" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<g class="c-purple">
  <rect x="480" y="370" width="160" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="394" text-anchor="middle" dominant-baseline="central">Persists but shifts</text>
  <text class="ts" x="560" y="414" text-anchor="middle" dominant-baseline="central">Geopolitics may force</text>
  <text class="ts" x="560" y="430" text-anchor="middle" dominant-baseline="central">de-Sinification of brand</text>
</g>

<line x1="40" y1="480" x2="640" y2="480" stroke="#B4B2A9" stroke-width="0.5"/>

<text class="th" x="340" y="510" text-anchor="middle">Key variables that determine the future</text>

<g class="c-teal">
  <rect x="40" y="530" width="290" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="552" text-anchor="middle" dominant-baseline="central">Homeland gravity (pull back?)</text>
</g>
<g class="c-teal">
  <rect x="350" y="530" width="290" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="495" y="552" text-anchor="middle" dominant-baseline="central">Institutional capital (stay?)</text>
</g>
<g class="c-teal">
  <rect x="40" y="590" width="290" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="185" y="612" text-anchor="middle" dominant-baseline="central">Soft power (identity anchor?)</text>
</g>
<g class="c-teal">
  <rect x="350" y="590" width="290" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="495" y="612" text-anchor="middle" dominant-baseline="central">Intermarriage rate (dissolve?)</text>
</g>

<g class="c-gray">
  <rect x="100" y="660" width="480" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="688" text-anchor="middle" dominant-baseline="central">The old clan model is dead for new diasporas</text>
  <text class="ts" x="340" y="710" text-anchor="middle" dominant-baseline="central">The question is what replaces it: digital networks,</text>
  <text class="ts" x="340" y="726" text-anchor="middle" dominant-baseline="central">VC circles, alumni associations, or nothing</text>
</g>
</svg>