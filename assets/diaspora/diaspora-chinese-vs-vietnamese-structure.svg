<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-amber > rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-green > rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #27500A; }
  .c-green .ts { fill: #3B6D11; }
  .c-coral > rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .c-red > rect { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red .th { fill: #791F1F; }
  .c-red .ts { fill: #A32D2D; }
  .c-blue > rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #0C447C; }
  .c-blue .ts { fill: #185FA5; }
  .arr { stroke: #888780; stroke-width: 1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="170" y="28" text-anchor="middle">Chinese diaspora</text>
<text class="th" x="510" y="28" text-anchor="middle">Vietnamese diaspora</text>

<g class="c-amber">
  <rect x="40" y="46" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="64" text-anchor="middle" dominant-baseline="central">1,500+ years of migration</text>
  <text class="ts" x="170" y="84" text-anchor="middle" dominant-baseline="central">Voluntary, trade-driven</text>
</g>
<line x1="170" y1="102" x2="170" y2="122" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
  <rect x="40" y="122" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="140" text-anchor="middle" dominant-baseline="central">Clan associations (hui kuan)</text>
  <text class="ts" x="170" y="160" text-anchor="middle" dominant-baseline="central">Capital, credit, schools</text>
</g>
<line x1="170" y1="178" x2="170" y2="198" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple">
  <rect x="40" y="198" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="216" text-anchor="middle" dominant-baseline="central">Bamboo network</text>
  <text class="ts" x="170" y="236" text-anchor="middle" dominant-baseline="central">Cross-border trade ecosystem</text>
</g>
<line x1="170" y1="254" x2="170" y2="274" class="arr" marker-end="url(#arrow)"/>
<g class="c-green">
  <rect x="40" y="274" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="292" text-anchor="middle" dominant-baseline="central">50%+ private wealth in SE Asia</text>
  <text class="ts" x="170" y="312" text-anchor="middle" dominant-baseline="central">~7% population, dominant</text>
</g>

<g class="c-coral">
  <rect x="380" y="46" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="64" text-anchor="middle" dominant-baseline="central">Post-1975 refugee waves</text>
  <text class="ts" x="510" y="84" text-anchor="middle" dominant-baseline="central">Involuntary, crisis-driven</text>
</g>
<line x1="510" y1="102" x2="510" y2="122" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
  <rect x="380" y="122" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="140" text-anchor="middle" dominant-baseline="central">No institutional layer</text>
  <text class="ts" x="510" y="160" text-anchor="middle" dominant-baseline="central">Family-level networks only</text>
</g>
<line x1="510" y1="178" x2="510" y2="198" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
  <rect x="380" y="198" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="216" text-anchor="middle" dominant-baseline="central">No cross-border network</text>
  <text class="ts" x="510" y="236" text-anchor="middle" dominant-baseline="central">Isolated, host-dependent</text>
</g>
<line x1="510" y1="254" x2="510" y2="274" class="arr" marker-end="url(#arrow)"/>
<g class="c-red">
  <rect x="380" y="274" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="292" text-anchor="middle" dominant-baseline="central">Stateless, marginalized</text>
  <text class="ts" x="510" y="312" text-anchor="middle" dominant-baseline="central">~90% lack citizenship (Cambodia)</text>
</g>

<text class="ts" x="340" y="365" text-anchor="middle">Same region, opposite outcomes</text>

<g class="c-blue">
  <rect x="120" y="385" width="440" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="403" text-anchor="middle" dominant-baseline="central">Exception: Viet Kieu in US, France, Australia</text>
  <text class="ts" x="340" y="423" text-anchor="middle" dominant-baseline="central">2.3M in US, $35B revenue</text>
</g>

<path d="M170 330 L170 355 L220 385" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M510 330 L510 355 L460 385" fill="none" class="arr" marker-end="url(#arrow)"/>
</svg>